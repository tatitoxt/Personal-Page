[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orkelya-content-api"
version = "0.1.0"
description = "FastAPI Backend for Orkelya Autonomous Content Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "redis>=5.0.3",
    "python-dotenv>=1.0.1",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
