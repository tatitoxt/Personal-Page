            </defs>

            <!-- Header -->
            <text x="60" y="70" fill="#F9FAFB" font-size="28" font-weight="700">Arquitectura: 7 Procesos Administrativos B2B a Automatizar</text>
            <text x="60" y="105" fill="#9CA3AF" font-size="16">Orkelya Autonomous Workflow Architecture</text>
            <line x1="60" y1="130" x2="1140" y2="130" stroke="#1F2937" stroke-width="2"/>
        
            <rect x="180" y="275" width="180" height="80" rx="12" fill="url(#grad)" stroke="#00F0FF" stroke-width="2"/>
            <text x="270.0" y="320.0" fill="#F9FAFB" font-size="16" font-weight="600" text-anchor="middle">WhatsApp Lead</text>
            
                <line x1="360" y1="315.0" x2="392" y2="315.0" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)"/>
                
            <rect x="400" y="275" width="180" height="80" rx="12" fill="url(#grad)" stroke="#00F0FF" stroke-width="2"/>
            <text x="490.0" y="320.0" fill="#F9FAFB" font-size="16" font-weight="600" text-anchor="middle">AI Agent</text>
            
                <line x1="580" y1="315.0" x2="612" y2="315.0" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)"/>
                
            <rect x="620" y="275" width="180" height="80" rx="12" fill="url(#grad)" stroke="#00F0FF" stroke-width="2"/>
            <text x="710.0" y="320.0" fill="#F9FAFB" font-size="16" font-weight="600" text-anchor="middle">Google Calendar</text>
            
                <line x1="800" y1="315.0" x2="832" y2="315.0" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)"/>
                
            <rect x="840" y="275" width="180" height="80" rx="12" fill="url(#grad)" stroke="#00F0FF" stroke-width="2"/>
            <text x="930.0" y="320.0" fill="#F9FAFB" font-size="16" font-weight="600" text-anchor="middle">Salesforce CRM</text>
            
